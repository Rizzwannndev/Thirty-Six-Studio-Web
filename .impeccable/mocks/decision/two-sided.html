<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#fff;font-family:Helvetica,Arial,sans-serif;color:#111}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px 40px;font-size:15px}
.sw{display:flex;gap:8px;align-items:center}.dot{width:18px;height:18px;border-radius:50%;background:#fd2c2a}
.half{position:absolute;top:70px;bottom:0;width:720px}
.w{left:0;padding:60px}.r{right:0;background:#fd2c2a;clip-path:circle(78% at 0% 50%)}
.w h2{font-size:84px;font-weight:400;letter-spacing:-.03em;line-height:.95;margin:0}
.w p{font-size:15px;width:70%;margin-top:30px}
.p{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a5c,#c11a12 60%,#5a0d07)}
.lab{position:absolute;bottom:30px;font-size:13px}
</style></head><body>
<nav><span>Thirtysixstudios</span><span class="sw"><span class="dot"></span>Flip to play side</span></nav>
<div class="half w"><h2>Our services</h2><p>Captivating design, interactive animation, reliable code and immaculate project coordination.</p><div class="lab" style="left:60px">Studio side</div></div>
<div class="half r"><div class="p" style="left:180px;top:120px;width:260px;height:260px"></div><div class="p" style="left:430px;top:420px;width:180px;height:180px"></div><div class="lab" style="right:60px;color:#111">Play side</div></div>
</body></html>
